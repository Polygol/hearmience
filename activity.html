<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://cdn.jsdelivr.net/gh/Polygol/polygol.github.io@main/assets/polygolapp/api/polygol-api.js"></script>
    <script src="lang.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: transparent;
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        .activity-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }

        .big {
            font-size: 1.2rem;
            font-weight: 700;
            font-family: 'Open Runde', 'Inter', sans-serif;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        
        .label {
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-btn {
            background-color: var(--search-background);
            border: 1px solid var(--glass-border);
            box-shadow: var(--sun-shadow);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.2, 0, 0.38, 0.9);
        }
        
        .material-symbols-rounded {
            font-size: 20px;
            color: var(--text-color);
        }
    </style>
    <script src="lang.js"></script>
</head>
<body data-app-name="HEARMIENCE">
    <div class="activity-container">
        <div class="info">
            <div id="status" class="big" data-lang-key="TITLE">Hearmience</div>
        </div>
        <div class="controls">
            <button id="stopBtn" class="control-btn">
                <span class="material-symbols-rounded">stop</span>
            </button>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusText = document.getElementById('status');
            const detailsText = document.getElementById('details');
            const stopBtn = document.getElementById('stopBtn');

            window.addEventListener('message', (event) => {
                if (event.source !== window.parent) return;
                const data = event.data;
                if (data && data.type === 'live-activity-update') {
                    statusText.textContent = data.activeCount > 0 ? t("SOUNDS_ACTIVE", {count: data.activeCount}) : t("STOPPED");

                    Polygol.liveActivity.pushHomescreenUpdate({
                        icon: 'hearing',
                        text: `${data.activeCount}`
                    });
                }
            });

            stopBtn.addEventListener('click', () => {
                // Command parent app via postMessage to target Hearmience logic
                window.parent.postMessage({
                    targetApp: 'Hearmience',
                    action: 'stop-hearmience'
                }, '*');
            });

            // Signal readiness to parent
            window.parent.postMessage({ targetApp: 'Hearmience', action: 'activity-ready' }, '*');
        });
    </script>
<script>
const bcpMap = { EN: 'en-US', JP: 'ja-JP', KO: 'ko-KR', ZH: 'zh-CN' };
window.bcpMap = bcpMap;
function getAppLanguage() {
    let l = (localStorage.getItem('language') || localStorage.getItem('selectedLanguage') || 'EN').toUpperCase();
    if (l === 'JA') l = 'JP';
    return ['EN', 'JP', 'KO', 'ZH'].includes(l) ? l : 'EN';
}
function t(key, params = {}) {
    const lang = getAppLanguage();
    const dict = window['LANG_' + lang + '_HEARMIENCE'] || window['LANG_EN_HEARMIENCE'] || {};
    let str = dict[key] || key;
    Object.keys(params).forEach(p => str = str.replace(new RegExp('\\{' + p + '\\}', 'g'), params[p]));
    return str;
}
function applyLanguage(langCode) {
    if (langCode) localStorage.setItem('language', langCode);
    const lang = getAppLanguage();
    document.querySelectorAll('[data-lang-key]').forEach(el => {
        const k = el.getAttribute('data-lang-key');
        if (k) el.textContent = t(k);
    });
}
window.addEventListener('message', (e) => {
    if (e.data && (e.data.type === 'languageUpdate' || e.data.type === 'localeUpdate')) {
        applyLanguage(e.data.languageCode);
    }
});
window.addEventListener('DOMContentLoaded', () => applyLanguage());
</script>
</body>
</html>
